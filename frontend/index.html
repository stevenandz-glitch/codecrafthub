<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCraftHub: Your Learning Management Platform</title>
    <link rel="stylesheet" href="/frontend/styles.css">
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>CodeCraftHub: Your Learning Management Platform</h1>
      </header>

      <main class="container">
        <!-- Add Course Form -->
        <section class="form-section">
          <h2>Add New Course</h2>
          <form id="course-form" class="course-form">
            <div class="form-group">
              <label for="name">Course Name *</label>
              <input type="text" id="name" name="name" required placeholder="Enter course name">
            </div>

            <div class="form-group">
              <label for="description">Description *</label>
              <textarea id="description" name="description" required placeholder="Enter course description" rows="3"></textarea>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="target_date">Target Date *</label>
                <input type="date" id="target_date" name="target_date" required>
              </div>

              <div class="form-group">
                <label for="status">Status *</label>
                <select id="status" name="status" required>
                  <option value="Not Started">Not Started</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Completed">Completed</option>
                </select>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="submit-btn">Add Course</button>
              <button type="button" class="btn btn-secondary" id="cancel-edit-btn" style="display: none;">Cancel</button>
            </div>
          </form>
        </section>

        <!-- Notification Area -->
        <div id="notification" class="notification" style="display: none;"></div>

        <!-- Loading Spinner -->
        <div id="loading" class="loading-spinner" style="display: none;">
          <div class="spinner"></div>
          <p>Loading courses...</p>
        </div>

        <!-- Courses List -->
        <section class="courses-section">
          <h2>Your Courses</h2>
          <div id="courses-container" class="courses-grid">
            <!-- Courses will be loaded here -->
          </div>
          <div id="no-courses" class="no-courses" style="display: none;">
            <p>No courses found. Add your first course above!</p>
          </div>
        </section>
      </main>

      <!-- Edit Modal -->
      <div id="edit-modal" class="modal" style="display: none;">
        <div class="modal-content">
          <div class="modal-header">
            <h3>Edit Course</h3>
            <button class="modal-close" id="close-modal">&times;</button>
          </div>
          <form id="edit-form" class="course-form">
            <input type="hidden" id="edit-id">

            <div class="form-group">
              <label for="edit-name">Course Name *</label>
              <input type="text" id="edit-name" name="name" required>
            </div>

            <div class="form-group">
              <label for="edit-description">Description *</label>
              <textarea id="edit-description" name="description" required rows="3"></textarea>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="edit-target_date">Target Date *</label>
                <input type="date" id="edit-target_date" name="target_date" required>
              </div>

              <div class="form-group">
                <label for="edit-status">Status *</label>
                <select id="edit-status" name="status" required>
                  <option value="Not Started">Not Started</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Completed">Completed</option>
                </select>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Save Changes</button>
              <button type="button" class="btn btn-secondary" id="cancel-modal-btn">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script type="module" src="/frontend/script.js"></script>
  </body>
</html>
